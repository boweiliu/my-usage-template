[project]
name = "my-usage"
version = "0.1.0"
description = "Your own usage data: what the workspace's analytics copy holds, with activity per day, chats, apps and the original records behind each number."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-schema",
    "flask>=3.0",
    "flask-sock>=0.7",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
    "werkzeug>=3.0",
]

[project.scripts]
my-usage = "my_usage.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_usage"]

[dependency-groups]
dev = [
    # The app's tests run from its own venv, which its sync gives the dev group: pytest
    # and what the ratchets check with.
    "imbue-common[testing]",
    # What runner_test.py asserts the API document with.
    "app-schema[testing]",
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
    # The browser tests drive the page with Fortress.
    "playwright==1.58.0",
]

# Makes this directory the tests' own pytest root, so they run against this app's venv
# rather than the workspace's root configuration.
[tool.pytest.ini_options]
testpaths = ["."]
markers = [
    "browser: marks tests that drive a browser",
    "frontend: marks tests that read an app's frontend source",
]

# The workspace's shared code, live and editable. app-schema's own workspace sources
# apply in this lock, so imbue-common comes from the root's mngr pin; a source for it
# here as well would be a second URL for one package, which uv refuses to lock.
[tool.uv.sources]
app-schema = { path = "../../libs/app_schema", editable = true }

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
